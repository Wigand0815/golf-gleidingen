<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gleidingen">
<meta name="theme-color" content="#16301f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Golf Gleidingen</title>
<style>
/* Layout: Vollbild-Karte, oben Bahnleiste, unten Entfernungen + Tab-Leiste */
:root{
  --bg:#f3f6ef; --panel:#ffffff; --ink:#14231a; --muted:#5b6b60; --line:#d6dfd2;
  --land:#dfe9cf; --fair:#6aa651; --fair-edge:#4e8a3c; --green:#a6dd84; --tee:#cfe8b5; --water:#7fbde0; --water-edge:#4f97c1; --sand:#ead79a; --rough:#c6dbad; --road:#b5afa4; --path:#7a7366;
  --c-gruen:#1f7f37; --c-blau:#1c58b0; --c-rot:#bf342b; --me:#0a84ff;
  --t-weiss:#ffffff; --t-gelb:#f2c230; --t-blau:#2a64b8; --t-rot:#d23b30; --edge:#14231a;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --num:ui-rounded,"SF Pro Rounded",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1712; --panel:#18231c; --ink:#e6efe7; --muted:#9db0a2; --line:#2a3a2f;
  --land:#1f2c20; --fair:#3d7533; --fair-edge:#5a9c4a; --green:#6fb653; --tee:#4c7a3f; --water:#2b6489; --water-edge:#5797bf; --sand:#7d6e43; --rough:#2c4128; --road:#6e6a62; --path:#bdb4a2;
  --c-gruen:#4cbb60; --c-blau:#5d93e6; --c-rot:#ea675c; --edge:#0b110d; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto auto}
/* Bahnleiste */
.top{padding:calc(var(--sat) + 6px) 10px 8px;background:var(--panel);border-bottom:1px solid var(--line);display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:6px;z-index:3}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:22px;display:grid;place-items:center;cursor:pointer}
.title{border:0;background:none;cursor:pointer;text-align:center;padding:2px 0;min-width:0}
.title .h{font-weight:800;font-size:19px;letter-spacing:.01em;display:flex;gap:8px;justify-content:center;align-items:center}
.title .sub{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{display:inline-block;width:12px;height:12px;border-radius:50%}
/* Karte */
.mapwrap{position:relative;overflow:hidden;touch-action:none;background:var(--bg)}
svg#map{position:absolute;inset:0;width:100%;height:100%;display:block}
.floating{position:absolute;right:10px;top:10px;display:grid;gap:8px;z-index:2}
.fab{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--panel);box-shadow:0 2px 8px rgba(0,0,0,.15);display:grid;place-items:center;font-size:12px;font-weight:700;cursor:pointer}
.fab.on{background:var(--me);color:#fff;border-color:var(--me)}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:14px;z-index:4;max-width:90%;text-align:center}
.srcbadge{position:absolute;left:10px;top:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted);z-index:2}
.attrib{position:absolute;left:8px;bottom:6px;font-size:10px;color:var(--muted);z-index:2}
/* Entfernungen */
.dist{background:var(--panel);border-top:1px solid var(--line);padding:8px 12px 6px;display:grid;gap:6px;z-index:3}
.dgrid{display:grid;grid-template-columns:1fr 1.3fr 1fr;align-items:end;text-align:center}
.dgrid .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.dgrid .v{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums;font-size:30px;line-height:1.05}
.dgrid .mid .v{font-size:46px}
.dgrid .v small{font-size:.45em;font-weight:600;color:var(--muted);margin-left:2px}
.drow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.drow::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600;display:inline-flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid var(--edge);display:inline-block;flex:none}
.hint{font-size:12.5px;color:var(--muted);text-align:center;min-height:16px}
/* Tabs */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:var(--sab);z-index:3}
.tabs button{border:0;background:none;padding:9px 0 8px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;display:grid;justify-items:center;gap:2px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-selected="true"]{color:var(--c-gruen)}
/* Seiten */
.page{position:absolute;top:0;left:0;right:0;bottom:calc(58px + var(--sab));background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--sat) + 14px) 14px 30px;z-index:5}
.page h2{font-size:24px;margin:4px 0 10px;font-weight:800}
.page h3{font-size:17px;margin:18px 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:10px 14px;font-weight:700;font-size:15px;cursor:pointer}
.btn.primary{background:var(--c-gruen);color:#fff;border-color:var(--c-gruen)}
.btn:disabled{opacity:.5}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:7px 6px;border-top:1px solid var(--line);text-align:center;font-size:15px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td:first-child,th:first-child{text-align:left}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:20px;font-weight:700;cursor:pointer}
.stepper b{min-width:28px;display:inline-block;font-size:18px;font-family:var(--num)}
.sc-under{color:var(--c-rot)} .sc-over{color:var(--c-blau)}
tr.cur td{background:color-mix(in srgb,var(--fair) 22%,transparent)}
tr.sum td{font-weight:800;border-top:2px solid var(--ink)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label.f input,label.f select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.small{font-size:13px;color:var(--muted);line-height:1.45}
.warn{color:var(--c-rot);font-weight:700}
/* Bahnwahl */
.picker{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:6;display:grid;align-items:start;padding-top:calc(var(--sat) + 70px)}
.picker .card{margin:0 10px;display:grid;gap:10px}
.picker .grid{display:grid;grid-template-columns:repeat(9,1fr);gap:5px}
.picker .grid button{aspect-ratio:1;border-radius:10px;border:0;color:#fff;font-weight:800;font-size:16px;cursor:pointer;display:grid;place-items:center;line-height:1}
.picker .grid button small{font-size:9px;font-weight:600;opacity:.9}
.picker .grid button.sel{outline:3px solid var(--ink);outline-offset:1px}
.lbl{font-size:13px;font-weight:700;color:var(--muted)}
button:focus-visible{outline:2px solid var(--me);outline-offset:2px}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <button class="iconbtn" id="prev" aria-label="Vorige Bahn">‹</button>
    <button class="title" id="titleBtn" aria-label="Bahn wählen"><div class="h" id="tH"></div><div class="sub" id="tS"></div></button>
    <button class="iconbtn" id="next" aria-label="Nächste Bahn">›</button>
  </div>
  <div class="mapwrap" id="mapwrap">
    <svg id="map" aria-label="Karte"><g id="world"></g><g id="overlay"></g></svg>
    <div class="srcbadge" id="srcBadge"></div>
    <div class="floating">
      <button class="fab" id="gpsBtn" aria-label="GPS">GPS</button>
      <button class="fab" id="viewBtn" aria-label="Ansicht">Bahn</button>
      <button class="fab" id="centerBtn" aria-label="Zentrieren">◎</button>
    </div>
    <div class="attrib" id="attrib"></div>
    <div class="toast" id="toast" hidden></div>
  </div>
  <div class="dist">
    <div class="dgrid">
      <div><div class="lab">Vorne</div><div class="v" id="dF">–</div></div>
      <div class="mid"><div class="lab" id="dMlab">Grünmitte</div><div class="v" id="dM">–</div></div>
      <div><div class="lab">Hinten</div><div class="v" id="dB">–</div></div>
    </div>
    <div class="hint" id="hint"></div>
    <div class="drow" id="teeRow"></div>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" id="tabMap" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Karte</button>
    <button role="tab" id="tabScore" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Score</button>
    <button role="tab" id="tabInfo" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>Daten</button>
  </div>
  <div class="page" id="pageScore" hidden></div>
  <div class="page" id="pageInfo" hidden></div>
  <div class="picker" id="picker" hidden></div>
</div>

const KX=111320*Math.cos(ANCHOR.lat*Math.PI/180), KY=110574;

const d2=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
const plen=p=>{let s=0;for(let i=1;i<p.length;i++)s+=d2(p[i-1],p[i]);return s;};
function along(line,m){ // Punkt m Meter vor dem Grün (Linienende), rückwärts, mit Verlängerung
  const p=[...line].reverse();
  for(let i=1;i<p.length;i++){const s=d2(p[i-1],p[i]);if(m<=s||i===p.length-1){const f=m/s;return [p[i-1][0]+(p[i][0]-p[i-1][0])*f,p[i-1][1]+(p[i][1]-p[i-1][1])*f];}m-=s;}
  return p[p.length-1];
}
function segDist(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy;let t=l?((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy);}
const lineDist=(p,l)=>{let m=1e9;for(let i=1;i<l.length;i++)m=Math.min(m,segDist(p,l[i-1],l[i]));return m;};
function inPoly(p,poly){let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[i],b=poly[j];if((a[1]>p[1])!==(b[1]>p[1])&&p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])c=!c;}return c;}
const centroid=poly=>{let x=0,y=0;poly.forEach(p=>{x+=p[0];y+=p[1];});return [x/poly.length,y/poly.length];};
function rayHits(o,c,poly){ // Schnittpunkte der Geraden o->c mit dem Polygon, als Parameter t
  const ts=[];const dx=c[0]-o[0],dy=c[1]-o[1];
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){const a=poly[j],b=poly[i];const ex=b[0]-a[0],ey=b[1]-a[1];const den=dx*ey-dy*ex;if(Math.abs(den)<1e-9)continue;
    const t=((a[0]-o[0])*ey-(a[1]-o[1])*ex)/den, u=((a[0]-o[0])*dy-(a[1]-o[1])*dx)/den; if(u>=0&&u<=1)ts.push(t);}
  return ts.sort((a,b)=>a-b);
}

function tail(l,m){ // Linienstück der Länge m vor dem Grün (verlängert, falls nötig)
  const p=[...l].reverse(),out=[p[0]];
  for(let i=1;i<p.length;i++){const s=d2(p[i-1],p[i]);if(m<=s||i===p.length-1){const f=m/s;out.push([p[i-1][0]+(p[i][0]-p[i-1][0])*f,p[i-1][1]+(p[i][1]-p[i-1][1])*f]);break;}out.push(p[i]);m-=s;}

}

  const P=GEO.poi; const icon=(p,t)=>{const q=proj(p);const g=el("g",{},overlay);el("rect",{x:q[0]-9,y:q[1]-9,width:18,height:18,rx:4,fill:"var(--panel)",stroke:"var(--ink)","stroke-width":1},g);txt(g,q[0],q[1],t,{"font-size":t.length>1?8:11,stroke:"none"});};
  if(z>0.25){P.huts.forEach(p=>icon(p,"⌂"));P.wc.forEach(p=>icon(p,"WC"));}
  {const q=proj(P.club);el("rect",{x:q[0]-30,y:q[1]-10,width:60,height:20,rx:5,fill:"var(--ink)"},overlay);txt(overlay,q[0],q[1],"Empfang",{fill:"var(--bg)",stroke:"none","font-size":11});}
  if(z>0.3){[[P.range,"Driving Range"],[P.kurz,"Kurzplatz"]].forEach(([p,t])=>{const q=proj(p);txt(overlay,q[0],q[1],t,{"font-size":11});});}
  // Bahnen
  LOOPS.forEach(k=>{for(let i=0;i<9;i++){const cur=k===S.loop&&i===S.h; if(!cur&&S.view==="hole"&&z>1.2)continue; drawHoleMarks(k,i,cur,z);}});
  // Messpunkt
  const gc=greenC(S.loop,S.h);
  if(S.tap){const q=proj(S.tap);const from=S.pos||teePt(S.loop,S.h,S.tee);const a=proj(from),b=proj(gc);
    el("polyline",{points:`${a[0]},${a[1]} ${q[0]},${q[1]} ${b[0]},${b[1]}`,fill:"none",stroke:"#fff","stroke-width":2.5,"stroke-dasharray":"6 4"},overlay);
    el("circle",{cx:q[0],cy:q[1],r:7,fill:"#fff",stroke:"var(--ink)","stroke-width":2},overlay);
    const d1=Math.round(d2(from,S.tap)),dd=Math.round(d2(S.tap,gc));
    const m1=[(a[0]+q[0])/2,(a[1]+q[1])/2],m2=[(q[0]+b[0])/2,(q[1]+b[1])/2];

  // eigene Position

    if(S.acc)el("circle",{cx:q[0],cy:q[1],r:Math.max(8,S.acc*z),fill:"var(--me)","fill-opacity":.13,stroke:"var(--me)","stroke-opacity":.35},overlay);
    if(!S.tap&&d2(S.pos,gc)<650){const b=proj(gc);el("line",{x1:q[0],y1:q[1],x2:b[0],y2:b[1],stroke:"var(--me)","stroke-width":2,"stroke-dasharray":"5 4"},overlay);}

function drawHoleMarks(k,i,cur,z){
  const col=`var(${COURSE[k].col})`, ho=hole(k,i), gc=greenC(k,i), g=proj(gc);

    const line=holeLine(k,i);
    if(ho[0]>3)[200,150,100].forEach(m=>{const dm=d2(gc,front)+m;if(dm<teeLen(k,i,S.tee)-15){const q=proj(along(line,dm));el("circle",{cx:q[0],cy:q[1],r:4.5,fill:"var(--panel)",stroke:"var(--ink)","stroke-width":1.4},overlay);if(z>1)txt(overlay,q[0]+16,q[1],String(m),{"font-size":10,fill:"var(--muted)"});}});
    // Tees

    el("circle",{cx:g[0],cy:g[1],r:3,fill:"var(--ink)"},overlay);
  }
  // Nummernschild am weißen Abschlag
  const l=holeLine(k,i), t=proj(teePt(k,i,0)), t2=proj(l.length>1?l[1]:gc);
  const dx=t2[0]-t[0],dy=t2[1]-t[1],dl=Math.hypot(dx,dy)||1; const r=cur?15:(z>0.6?11:8);

  if(r>10)txt(hg,bx,by+r*0.5,"Par "+ho[0],{fill:"#fff",stroke:"none","font-size":r*0.45,"font-weight":700});
}

/* ---------- Entfernungen ---------- */
function frontBackFrom(from,k,i){
  const gc=greenC(k,i), gp=GEO.greens[k][i];
  if(gp){const ts=rayHits(from,gc,gp).filter(t=>t>0);if(ts.length>=2){const f=ts[0],b=ts[ts.length-1];const P=t=>[from[0]+(gc[0]-from[0])*t,from[1]+(gc[1]-from[1])*t];return [P(f),P(b),true];}}
  const d=d2(from,gc)||1, ux=(gc[0]-from[0])/d, uy=(gc[1]-from[1])/d, r=12;
  return [[gc[0]-ux*r,gc[1]-uy*r],[gc[0]+ux*r,gc[1]+uy*r],false];
}
function updateDist(){
  const k=S.loop,i=S.h,gc=greenC(k,i);
  const usePos=S.pos&&d2(S.pos,gc)<900;
  const from=usePos?S.pos:teePt(k,i,S.tee);
  const [f,b,exact]=frontBackFrom(from,k,i);
  const set=(id,v)=>{document.getElementById(id).innerHTML=Math.round(v)+"<small>m</small>";};
  set("dF",d2(from,f));set("dM",d2(from,gc));set("dB",d2(from,b));
  document.getElementById("dMlab").textContent=usePos?"Grünmitte":"vom Abschlag";
  let h="";
  if(!usePos)h=S.gpsOn?(S.pos?"Sie sind nicht auf dieser Bahn – Werte ab "+TEES[S.tee].n+" Abschlag.":"Warte auf GPS …"):"Werte ab "+TEES[S.tee].n+" Abschlag. GPS einschalten für Live-Entfernungen.";
  else h="GPS ±"+Math.round(S.acc||0)+" m"+(exact?"":" · Grünkanten geschätzt");
  if(S.tap)h="Messpunkt: tippen Sie erneut zum Versetzen, lange halten zum Löschen.";
  document.getElementById("hint").textContent=h;
}

function selectHole(k,i,manual){S.loop=k;S.h=i;S.tap=null;if(manual)S.manualAt=Date.now();save();updateTop();if(S.view==="hole")viewHole();else drawOverlay();updateDist();}

  const r=S.round.filter(Boolean); if(r.includes(S.loop)&&r.length===2){const pos=r.indexOf(S.loop)*9+S.h+d;const p=(pos+18)%18;selectHole(r[Math.floor(p/9)],p%9,true);return;}

    const r=drag.v.rot*Math.PI/180,c=Math.cos(r),s=Math.sin(r);V.cx=drag.v.cx-(dx*c-dy*s)/V.s;V.cy=drag.v.cy-(dx*s+dy*c)/V.s;applyView();}

    const b=BADGES.filter(b=>Math.hypot(b.x-x,b.y-y)<b.r+8).sort((a,c)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(c.x-x,c.y-y))[0];

let watchId=null;
function onLoc(lat,lon,acc){
  const p=toLocal(lat,lon); S.pos=[p[0]+S.calib[0],p[1]+S.calib[1]]; S.acc=acc; S.raw=p;
  if(S.auto&&!(S.manualAt&&Date.now()-S.manualAt<120000))autoHole();

}
window.__nativeLocation=(lat,lon,acc)=>onLoc(lat,lon,acc);

const native=window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.native;
function startGPS(){
  S.gpsOn=true;save();updateTop();
  if(native){native.postMessage({cmd:"startLocation"});return;}
  if(!("geolocation" in navigator)){toast("Dieses Gerät liefert keine Position.");return;}
  watchId=navigator.geolocation.watchPosition(p=>onLoc(p.coords.latitude,p.coords.longitude,p.coords.accuracy),
    err=>{toast(err.code===1?"Ortung abgelehnt. In iOS-Einstellungen › Datenschutz › Ortungsdienste erlauben.":"Position nicht verfügbar.",5000);},
    {enableHighAccuracy:true,maximumAge:2000,timeout:20000});
}
function stopGPS(){S.gpsOn=false;save();if(native)native.postMessage({cmd:"stopLocation"});else if(watchId!=null)navigator.geolocation.clearWatch(watchId);watchId=null;S.pos=null;updateTop();drawOverlay();updateDist();}
function autoHole(){
  let best=null;
  LOOPS.forEach(k=>{for(let i=0;i<9;i++){const l=[teePt(k,i,0),...holeLine(k,i).slice(1)];const d=lineDist(S.pos,l);if(!best||d<best.d)best={k,i,d};}});
  if(!best)return; const curD=lineDist(S.pos,holeLine(S.loop,S.h));
  if(best.d<30&&(best.k!==S.loop||best.i!==S.h)&&curD>45){S.loop=best.k;S.h=best.i;S.tap=null;save();updateTop();if(S.view==="hole")viewHole();toast(`${COURSE[best.k].name} ${best.i+1}`);}
}

/* ---------- OSM laden ---------- */
const OVERPASS=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://overpass.private.coffee/api/interpreter"];
const Q=`[out:json][timeout:90];(way(around:1400,52.2729,9.8591)[golf];relation(around:1400,52.2729,9.8591)[golf];way(around:1400,52.2729,9.8591)[natural=water];relation(around:1400,52.2729,9.8591)[natural=water];way(around:1400,52.2729,9.8591)[highway];way(around:1400,52.2729,9.8591)[leisure=golf_course];relation(around:1400,52.2729,9.8591)[leisure=golf_course];);out geom;`;
async function fetchOSM(){
  let lastErr="";
  for(const u of OVERPASS){
    try{const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),60000);
      const r=await fetch(u,{method:"POST",body:"data="+encodeURIComponent(Q),headers:{"Content-Type":"application/x-www-form-urlencoded"},signal:ctl.signal});clearTimeout(to);
      if(!r.ok){lastErr=u+": HTTP "+r.status;continue;} return await r.json();}
    catch(e){lastErr=u+": "+e.message;}
  }
  if(native){ // Fallback über die native App
    return new Promise((res,rej)=>{window.__nativeOSM=(txt,err)=>{if(err)rej(new Error(err));else{try{res(JSON.parse(txt));}catch(e){rej(e);}}};native.postMessage({cmd:"fetch",url:OVERPASS[0],body:"data="+encodeURIComponent(Q)});});
  }
  throw new Error(lastErr||"kein Server erreichbar");
}
function joinWays(ways){ // Ringe aus Teilstücken zusammensetzen
  const segs=ways.map(w=>w.slice()),rings=[];
  while(segs.length){let r=segs.shift();let grown=true;
    while(grown&&d2(r[0],r[r.length-1])>0.5){grown=false;
      for(let i=0;i<segs.length;i++){const s=segs[i],a=r[r.length-1];
        if(d2(a,s[0])<0.5){r=r.concat(s.slice(1));segs.splice(i,1);grown=true;break;}
        if(d2(a,s[s.length-1])<0.5){r=r.concat(s.slice(0,-1).reverse());segs.splice(i,1);grown=true;break;}}}
    if(r.length>=3)rings.push(r);}
  return rings;
}
function processOSM(j){
  const out={date:Date.now(),fair:[],green:[],tee:[],sand:[],water:[],rough:[],range:[],roads:[],paths:[],kurz:[],names:[],bound:null,holes:{gruen:[],blau:[],rot:[]},report:[]};
  const geo=g=>g.map(p=>toLocal(p.lat,p.lon));
  const polysOf=e=>{if(e.type==="way"&&e.geometry){const g=geo(e.geometry);return d2(g[0],g[g.length-1])<0.5?[g]:[];}
    if(e.type==="relation"&&e.members){return joinWays(e.members.filter(m=>m.type==="way"&&m.geometry&&m.role!=="inner").map(m=>geo(m.geometry)));}return [];};
  const holeWays=[]; const named=new Set();
  j.elements.forEach(e=>{const t=e.tags||{};
    if(t.golf==="hole"&&e.geometry){holeWays.push({ref:String(t.ref||""),par:+t.par||null,line:geo(e.geometry)});return;}
    if(t.leisure==="golf_course"){const p=polysOf(e);if(p.length){const big=p.sort((a,b)=>b.length-a.length)[0];if(!out.bound||big.length>out.bound.length)out.bound=big;}return;}
    const add=(arr)=>polysOf(e).forEach(p=>arr.push(p));
    switch(t.golf){
      case "fairway":add(out.fair);return; case "green":add(out.green);return; case "tee":add(out.tee);return;
      case "bunker":add(out.sand);return; case "rough":add(out.rough);return; case "driving_range":add(out.range);return;
      case "water_hazard":case "lateral_water_hazard":add(out.water);return;
      case "cartpath":case "path":if(e.geometry)out.paths.push(geo(e.geometry));return;}
    if(t.natural==="water"){add(out.water);return;}
    if(t.highway&&e.geometry){const g=geo(e.geometry);
      if(["footway","path","track","cycleway","bridleway","steps","service"].includes(t.highway)&&!t.name)out.paths.push(g);else out.roads.push(g);
      if(t.name&&!named.has(t.name)){named.add(t.name);out.names.push([t.name,g[Math.floor(g.length/2)]]);}}
  });
  // Bahnen zuordnen: OSM-Nummern 1–9 Blau, 10–18 Grün, 19–27 Rot (mit Par-Kontrolle)
  holeWays.forEach(h=>{
    if(/^K/i.test(h.ref)){out.kurz.push(h.line);return;}
    const n=parseInt(h.ref,10); if(!(n>=1&&n<=27))return;
    const k=n<=9?"blau":n<=18?"gruen":"rot", i=(n-1)%9;
    const end=h.line[h.line.length-1];
    let green=out.green.find(p=>inPoly(end,p)); if(!green){let bd=40;out.green.forEach(p=>{const d=d2(centroid(p),end);if(d<bd){bd=d;green=p;}});}
    out.holes[k][i]={line:h.line,green:green||null};
    const par=COURSE[k].holes[i][0]; if(h.par&&h.par!==par)out.report.push(`OSM ${n}: Par ${h.par}, Scorekarte ${COURSE[k].name} ${i+1}: Par ${par}`);
  });
  const found=LOOPS.reduce((a,k)=>a+out.holes[k].filter(Boolean).length,0);
  out.report.unshift(`${found} von 27 Bahnen, ${out.green.length} Grüns, ${out.tee.length} Abschläge, ${out.fair.length} Fairways, ${out.water.length} Gewässer gefunden.`);
  if(!out.fair.length){out.fair=FALLBACK.fair;out.report.push("Keine Fairways in OSM – Fairways aus der Plan-Näherung.");}
  if(!out.water.length)out.water=FALLBACK.water;
  if(!out.roads.length)out.roads=FALLBACK.roads;
  if(!out.sand.length)out.sand=FALLBACK.sand;
  const rnd=a=>a.map(p=>p.map(q=>[Math.round(q[0]*10)/10,Math.round(q[1]*10)/10]));
  ["fair","green","tee","sand","water","rough","range","roads","paths","kurz"].forEach(k=>out[k]=rnd(out[k]));
  return out;
}
async function loadOSM(btn){
  if(btn){btn.disabled=true;btn.textContent="Lade …";}
  try{const j=await fetchOSM();const o=processOSM(j);
    if(!LOOPS.some(k=>o.holes[k].some(Boolean)))throw new Error("Keine Bahnen in den OSM-Daten gefunden.");
    OSM=o;LS.set("gg_osm_v1",OSM);S.calib=[0,0];save();GEO=G();drawWorld();resetView();updateDist();toast("OSM-Daten geladen und gespeichert",3000);}
  catch(e){toast(btn?"OSM-Download fehlgeschlagen: "+e.message:"OSM-Daten noch nicht geladen – später unter „Daten“ erneut versuchen.",btn?6000:3500);}
  if(btn){btn.disabled=false;btn.textContent="OSM-Daten laden";}
  if(pageOpen("pageInfo"))renderInfo();
}

  let rows="",tot=0,totPar=0,played=0,half=[0,0,0,0];

    if(v){tot+=v;totPar+=par;played++;half[hi*2]+=v;half[hi*2+1]+=par;}
    const diff=v?v-par:null;
    rows+=`<tr class="${k===S.loop&&i===S.h?"cur":""}"><td><button class="btn" style="padding:4px 8px" data-go="${k},${i}"><span class="dot" style="background:var(${COURSE[k].col})"></span> ${i+1}</button></td><td>${par}</td><td>${ho[TEES[S.tee].i]}</td><td>${ho[TEES[S.tee].i+1]}</td>
    <td><span class="stepper"><button data-k="${key}" data-d="-1" aria-label="weniger">−</button><b class="${diff==null?"":diff<0?"sc-under":diff>0?"sc-over":""}">${v||"·"}</b><button data-k="${key}" data-d="1" aria-label="mehr">+</button></span></td></tr>`;});
    rows+=`<tr class="sum"><td>${COURSE[k].name}</td><td>36</td><td colspan="2"></td><td>${half[hi*2]||"–"}</td></tr>`;});
  const vs=played?tot-totPar:0;
  const both=r[0]&&r[1]; const rt=both?ratingFor(r[0],r[1]):null;
  let ch="";if(rt&&S.hi!==""&&!isNaN(parseFloat(S.hi))){const [sl,cr]=rt[S.tee];const v=parseFloat(String(S.hi).replace(",","."))*sl/113+(cr-72);ch=`Spielvorgabe ${TEES[S.tee].n}: <b>${Math.round(v)}</b> <span class="small">(HI × ${sl}/113 + ${cr.toFixed(1).replace(".",",")} − 72)</span>`;}
  document.getElementById("pageScore").innerHTML=`<h2>Score</h2>
  <div class="card"><div class="row"><label class="f" style="flex:1">1. Neun<select id="r0">${opts(r[0])}</select></label><label class="f" style="flex:1">2. Neun<select id="r1">${opts(r[1])}</select></label></div>
  <p class="small" style="margin:8px 0 0">${both?`CR ${rt[S.tee][1].toFixed(1).replace(".",",")} · Slope ${rt[S.tee][0]} (${TEES[S.tee].n})`:"9-Loch-Runde"}</p>
  <div class="row" style="margin-top:8px"><label class="f" style="flex:1">Handicap-Index<input id="hi" inputmode="decimal" value="${S.hi}" placeholder="z. B. 18,4"></label></div>
  <p style="margin:8px 0 0">${ch}</p></div>
  <div class="card" style="margin-top:12px;padding:6px 8px"><table><thead><tr><th>Loch</th><th>Par</th><th>m</th><th>Hcp</th><th>Schläge</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="card" style="margin-top:12px"><div class="kv"><dt>Gespielt</dt><dd>${played} Löcher</dd><dt>Schläge</dt><dd><b>${tot||"–"}</b></dd><dt>Zu Par</dt><dd><b>${played?(vs>0?"+":"")+vs:"–"}</b></dd></div>
  <div class="row" style="margin-top:10px"><button class="btn" id="resetScore">Runde löschen</button><span class="small" id="resetHint"></span></div></div>`;
  const pg=document.getElementById("pageScore");
  pg.querySelector("#r0").onchange=e=>{S.round[0]=e.target.value;save();renderScore();};
  pg.querySelector("#r1").onchange=e=>{S.round[1]=e.target.value;save();renderScore();};
  pg.querySelector("#hi").onchange=e=>{S.hi=e.target.value.replace(",",".");save();renderScore();};
  pg.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const key=b.dataset.k,d=+b.dataset.d,lp=key.match(/^([a-z]+)(\d)$/),par=COURSE[lp[1]].holes[+lp[2]][0];
    const cur=S.scores[key]||0; let v=cur?cur+d:(d>0?par:par-1); if(v<=0)delete S.scores[key]; else S.scores[key]=v; save();renderScore();});
  pg.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const [k,i]=b.dataset.go.split(",");selectHole(k,+i,true);tab("Map");});
  let armed=false;pg.querySelector("#resetScore").onclick=e=>{if(!armed){armed=true;e.target.textContent="Wirklich löschen?";pg.querySelector("#resetHint").textContent="Nochmals tippen zum Bestätigen";return;}S.scores={};save();renderScore();};
}
function renderInfo(){
  const osm=OSM;
  document.getElementById("pageInfo").innerHTML=`<h2>Daten &amp; GPS</h2>
  <div class="card"><h3 style="margin-top:0">Kartengrundlage</h3>
   <p class="small">${osm?`<b>OpenStreetMap</b>, geladen am ${new Date(osm.date).toLocaleString("de-DE")}. Läuft offline aus dem Gerätespeicher.<br>${osm.report.map(r=>"• "+r).join("<br>")}`:
   `<b>Plan-Näherung</b>: nach dem Platzplan der Scorekarte, mit OpenStreetMap-Screenshots verortet (etwa ±20–40 m). Mit Internet einmal „OSM-Daten laden“ tippen: Dann nutzt die App die exakten Bahn-, Grün- und Abschlagsdaten und speichert sie für den Offline-Betrieb.`}</p>
   <div class="row"><button class="btn primary" id="osmBtn">OSM-Daten laden</button>${osm?`<button class="btn" id="osmDel">Plan-Näherung nutzen</button>`:""}</div></div>
  <div class="card" style="margin-top:12px"><h3 style="margin-top:0">Position kalibrieren</h3>
   <p class="small">Falls Ihr Punkt neben der Karte liegt: auf ein bekanntes Merkmal der aktuellen Bahn stellen und tippen. Die App verschiebt danach alle GPS-Positionen um diesen Versatz. Aktueller Versatz: ${Math.round(S.calib[0])} m Ost, ${Math.round(S.calib[1])} m Nord.</p>
   <div class="row"><button class="btn" id="calG">Ich stehe in der Grünmitte</button><button class="btn" id="calT">Ich stehe am ${TEES[S.tee].n} Abschlag</button><button class="btn" id="calR">Zurücksetzen</button></div>
   <p class="small" id="calMsg"></p></div>
  <div class="card" style="margin-top:12px"><h3 style="margin-top:0">Bedienung</h3>
   <p class="small">Tippen auf die Karte setzt einen Messpunkt (Entfernung zu Ihnen bzw. zum Abschlag und zum Grün). Lange halten löscht ihn. Zwei Finger zoomen. „Bahn“ dreht die Karte in Spielrichtung, „Platz“ zeigt die Gesamtanlage genordet. Auto-Bahn wählt die Bahn nach Ihrer Position.</p></div>
  <div class="card" style="margin-top:12px"><h3 style="margin-top:0">Platzregeln (Auszug)</h3>
   <p class="small">Waste-Area ist kein Bunker, sie wird wie das Fairway gespielt und darf nicht mit Trolleys befahren werden. Inselgrün (Grün 8): Die Steinkante ist die Grenze zum Wasser, schwarze Kugeln markieren die Dropping-Zone. Pfähle: 3 Ringe 200 m, 2 Ringe 150 m, 1 Ring 100 m bis Grünanfang. Richtzeit 9 Loch: max. 2 Std.</p>
   <p class="small"><span class="warn">Blau 9:</span> Scorekarte Weiß 404 m / Gelb 302 m – vermutlich Druckfehler.</p></div>
  <p class="small" style="margin-top:14px">Golf Gleidingen · Am Golfplatz 1 · 30880 Laatzen · 05102 739000<br>Scorekarte: Golf51. Kartendaten nach Download: © OpenStreetMap-Mitwirkende (ODbL). Private Hilfs-App, keine offizielle App des Clubs.</p>`;
  const pg=document.getElementById("pageInfo");
  pg.querySelector("#osmBtn").onclick=e=>loadOSM(e.target);
  const del=pg.querySelector("#osmDel"); if(del)del.onclick=()=>{OSM=null;LS.set("gg_osm_v1",null);GEO=G();drawWorld();renderInfo();};
  const cal=target=>{if(!S.raw){pg.querySelector("#calMsg").textContent="Noch keine GPS-Position. Erst GPS einschalten.";return;}S.calib=[target[0]-S.raw[0],target[1]-S.raw[1]];save();S.pos=[S.raw[0]+S.calib[0],S.raw[1]+S.calib[1]];renderInfo();drawOverlay();updateDist();toast("Kalibriert");};
  pg.querySelector("#calG").onclick=()=>cal(greenC(S.loop,S.h));
  pg.querySelector("#calT").onclick=()=>cal(teePt(S.loop,S.h,S.tee));
  pg.querySelector("#calR").onclick=()=>{S.calib=[0,0];save();if(S.raw)S.pos=S.raw.slice();renderInfo();drawOverlay();updateDist();};
}

/* ---------- Bahnwahl ---------- */
function openPicker(){
  const p=document.getElementById("picker");
  p.innerHTML=`<div class="card">${LOOPS.map(k=>`<div class="lbl">${COURSE[k].name}</div><div class="grid">${COURSE[k].holes.map((ho,i)=>`<button class="${k===S.loop&&i===S.h?"sel":""}" style="background:var(${COURSE[k].col})" data-k="${k}" data-i="${i}">${i+1}<small>Par ${ho[0]}</small></button>`).join("")}</div>`).join("")}<button class="btn" id="pClose">Schließen</button></div>`;
  p.hidden=false;
  p.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{p.hidden=true;selectHole(b.dataset.k,+b.dataset.i,true);});
  p.querySelector("#pClose").onclick=()=>p.hidden=true; p.onclick=e=>{if(e.target===p)p.hidden=true;};
}

/* ---------- Start ---------- */
document.querySelector(".floating").addEventListener("pointerdown",e=>e.stopPropagation());
document.getElementById("prev").onclick=()=>step(-1);
document.getElementById("next").onclick=()=>step(1);
document.getElementById("titleBtn").onclick=openPicker;
document.getElementById("gpsBtn").onclick=()=>S.gpsOn?stopGPS():startGPS();
document.getElementById("viewBtn").onclick=()=>{S.view=S.view==="hole"?"all":"hole";save();updateTop();resetView();};
document.getElementById("centerBtn").onclick=()=>{if(S.pos){V.cx=S.pos[0];V.cy=-S.pos[1];applyView();}else resetView();};
["Map","Score","Info"].forEach(n=>document.getElementById("tab"+n).onclick=()=>tab(n));
window.addEventListener("resize",()=>{size();resetView();});
size();drawWorld();updateTop();resetView();updateDist();
if(S.gpsOn)startGPS();
if(!OSM&&navigator.onLine!==false&&!LS.get("gg_osm_tried",false)){LS.set("gg_osm_tried",true);setTimeout(()=>loadOSM(null),1500);}
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});

</script>
